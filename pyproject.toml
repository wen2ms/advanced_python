[project]
name = "advanced-python"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "mypy>=2.3.1",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "E203",
  "E266",
  "E501",
  "D",
  "T201",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
